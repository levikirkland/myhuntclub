    <rect x="360" y="210" width="8" height="28" rx="1" />
    <rect x="460" y="210" width="8" height="28" rx="1" />
    <rect x="560" y="210" width="8" height="28" rx="1" />
    <rect x="660" y="210" width="8" height="28" rx="1" />
    <rect x="760" y="210" width="8" height="28" rx="1" />
    <rect x="860" y="210" width="8" height="28" rx="1" />
    <rect x="960" y="210" width="8" height="28" rx="1" />
    <rect x="1060" y="210" width="8" height="28" rx="1" />
    <rect x="1160" y="210" width="8" height="28" rx="1" />
    <!-- rails -->
    <rect x="40" y="220" width="1180" height="6" rx="3" />
    <rect x="40" y="235" width="1180" height="6" rx="3" opacity="0.9"/>
